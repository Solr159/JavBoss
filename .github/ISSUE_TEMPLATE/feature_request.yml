name: 功能建议
description: 提议新功能，或建议改进现有功能
title: "[功能建议] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助 JavBoss 变得更好。提交前请先搜索现有 Issue，避免重复建议。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，确认没有相同或相近的建议。
          required: true
        - label: 我已搜索现有 Issue，确认没有相同或相近的建议2。
          required: true
   
  - type: textarea
    id: problem
    attributes:
      label: 使用场景或问题
      description: 请说明你在什么场景下需要这个功能，以及当前遇到的问题。
      placeholder: 当我……时，希望能够……，因为……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案
      description: 请描述你期望的功能、交互方式或行为。
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: 可附上截图、示意图、相关链接或其他有助于理解建议的信息。

