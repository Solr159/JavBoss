name: 错误反馈
description: 报告可复现的异常行为或程序错误
title: "[错误反馈] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢你反馈问题。完整的复现信息和日志能帮助我们更快定位问题。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，确认没有相同问题。
          required: true
        - label: 我使用的是 JavBoss 的最新版本，或已确认该问题在最新版本中仍然存在。
          required: true

  - type: input
    id: version
    attributes:
      label: JavBoss 版本
      placeholder: 例如：v0.1.0
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
        - Docker
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供能够稳定复现问题的最简步骤。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: 预期行为
      description: 你原本期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: 实际行为
      description: 实际发生了什么？
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或报错信息
      description: 请粘贴相关日志或报错，并注意移除隐私信息。
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: 可附上截图、视频、配置或其他有助于定位问题的信息。

