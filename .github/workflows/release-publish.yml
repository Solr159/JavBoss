name: release-publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (v2.1.4 or browser-extension-v0.11.0); published tags can retry README sync"
        required: true

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24"
  RELEASE_TAG: ${{ inputs.tag }}

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft with explicit Latest policy
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" =~ ^browser-extension-v[0-9]+(\.[0-9]+){0,3}$ ]]; then
            latest=false
          elif [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            latest=true
          else
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          release_json="$RUNNER_TEMP/javboss-release.json"
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft,isPrerelease,assets > "$release_json"
          jq -e '.isPrerelease == false' "$release_json" > /dev/null
          if [[ "$latest" == true ]]; then
            for platform in windows-x86_64 linux-x86_64 macos-x86_64 macos-arm64; do
              jq -e --arg name "javboss-${RELEASE_TAG}-${platform}.zip" 'any(.assets[]; .name == $name)' "$release_json" > /dev/null
            done
          else
            jq -e --arg name "javboss-${RELEASE_TAG}.zip" 'any(.assets[]; .name == $name)' "$release_json" > /dev/null
          fi
          jq -e '[.assets[] | select(.name | test("^javboss-browser-extension-v[0-9]+(\\.[0-9]+){0,3}\\.zip$"))] | length <= 1' "$release_json" > /dev/null
          if jq -e '.isDraft == true' "$release_json" > /dev/null; then
            gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false --latest="$latest"
          else
            echo "Release is already published; checking whether README sync is needed."
          fi

          # Retrying an older release must not replace the current Latest links.
          update_readme=true
          if [[ "$latest" == true ]]; then
            latest_tag="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
            if [[ "$latest_tag" == "$RELEASE_TAG" ]]; then
              echo "Updating README for the latest application release."
            else
              update_readme=false
              echo "Latest is $latest_tag; leaving README unchanged."
            fi
          fi
          echo "update_readme=$update_readme" >> "$GITHUB_OUTPUT"

      - name: Checkout publishing scripts
        if: steps.release.outputs.update_readme == 'true'
        uses: actions/checkout@v5
        with:
          path: release-tools
          persist-credentials: false

      - name: Checkout main for README update
        if: steps.release.outputs.update_readme == 'true'
        uses: actions/checkout@v5
        with:
          ref: main
          path: main
          # Optional: use a PAT if the README PR needs to trigger other workflows.
          token: ${{ secrets.RELEASE_PUBLISH_TOKEN || github.token }}

      - name: Setup Node
        if: steps.release.outputs.update_readme == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create or update README pull request
        if: steps.release.outputs.update_readme == 'true'
        working-directory: main
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/release-tools/scripts/update-release-version.mjs" "$RELEASE_TAG" "$RUNNER_TEMP/javboss-release.json" README.md
          if git diff --quiet -- README.md; then
            echo "README download links already point to $RELEASE_TAG."
            exit 0
          fi

          branch="release-readme/${RELEASE_TAG}"
          remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md
          git commit -m "docs: update download links to $RELEASE_TAG"
          # Only replace this workflow's branch, and reject concurrent changes.
          git push --force-with-lease="refs/heads/$branch:$remote_sha" origin "HEAD:refs/heads/$branch"

          title="docs: update download links for $RELEASE_TAG"
          body_file="$RUNNER_TEMP/readme-pr-body.md"
          printf 'Updates the applicable application and browser extension download links in README.md for [%s](https://github.com/%s/releases/tag/%s).\n\nGenerated after publishing the release. Merge this PR to update the links on main.\n' "$RELEASE_TAG" "$GH_REPO" "$RELEASE_TAG" > "$body_file"
          pr_number="$(gh pr list --repo "$GH_REPO" --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --repo "$GH_REPO" --title "$title" --body-file "$body_file"
          else
            gh pr create --repo "$GH_REPO" --head "$branch" --base main --title "$title" --body-file "$body_file"
          fi
