name: release-draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to create or reuse for the draft release"
        required: true
      version:
        description: "Release version"
        required: true
      publish_browser_extension:
        description: "Include the browser extension in the draft release"
        type: boolean
        default: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "23.11.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-x86_64
          - linux-x86_64
          - macos-x86_64
          - macos-arm64
    runs-on: ${{ fromJson('{"windows-x86_64":"ubuntu-latest","linux-x86_64":"ubuntu-latest","macos-x86_64":"macos-15-intel","macos-arm64":"macos-14"}')[matrix.platform] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install build deps (Windows target)
        if: ${{ matrix.platform == 'windows-x86_64' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip unzip

      - name: Install build deps (Linux target)
        if: ${{ matrix.platform == 'linux-x86_64' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip

      - name: Build CLI bundle
        run: |
          cd scripts/cli
          npm install
          npm run build

      - name: Download ffmpeg/ffprobe
        run: bash scripts/cli.sh download-dependencies "${{ matrix.platform }}"

      - name: Build release
        run: bash scripts/cli.sh release "${{ matrix.platform }}" "${{ inputs.version }}"

      - name: Upload release asset
        uses: actions/upload-artifact@v6
        with:
          name: javboss-${{ inputs.version }}-${{ matrix.platform }}-zip
          path: release/javboss-${{ inputs.version }}-${{ matrix.platform }}.zip

  build-browser-extension:
    if: ${{ inputs.publish_browser_extension }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Read extension version
        id: extension
        run: |
          version="$(node -p "require('./browser-extension/manifest.json').version")"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "invalid extension version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build CLI bundle
        run: |
          cd scripts/cli
          npm install
          npm run build

      - name: Build browser extension release
        run: bash scripts/cli.sh release-browser-extension

      - name: Upload browser extension release asset
        uses: actions/upload-artifact@v6
        with:
          name: javboss-browser-extension-v${{ steps.extension.outputs.version }}-zip
          path: release/javboss-browser-extension-v${{ steps.extension.outputs.version }}.zip

  publish:
    needs: [build, build-browser-extension]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' &&
          (needs.build-browser-extension.result == 'success' ||
           (!inputs.publish_browser_extension && needs.build-browser-extension.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISH_BROWSER_EXTENSION: ${{ inputs.publish_browser_extension }}
        run: |
          if gh release view "${{ inputs.tag }}" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "release for tag '${{ inputs.tag }}' already exists" >&2
            exit 1
          fi

          mapfile -t assets < <(find release-artifacts -type f -name "*.zip" | sort)
          expected_assets=4
          if [[ "$PUBLISH_BROWSER_EXTENSION" == "true" ]]; then
            expected_assets=5
          fi
          if [[ "${#assets[@]}" -ne "$expected_assets" ]]; then
            echo "expected $expected_assets release assets, found ${#assets[@]}" >&2
            exit 1
          fi

          gh release create "${{ inputs.tag }}" "${assets[@]}" \
            --repo "$GH_REPO" \
            --target "${{ github.sha }}" \
            --draft \
            --title "JavBoss ${{ inputs.version }}" \
            --generate-notes
